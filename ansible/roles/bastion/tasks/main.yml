---
- name: Install PostgreSQL client and unzip on Bastion
  ansible.builtin.apt:
    name:
      - postgresql-client
      - unzip
    state: present
    update_cache: true

- name: Download AWS CLI v2 installer
  ansible.builtin.get_url:
    url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    dest: /tmp/awscliv2.zip
    mode: "0644"

- name: Extract AWS CLI v2 installer
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    remote_src: true
    creates: /tmp/aws/install

- name: Install AWS CLI v2
  ansible.builtin.command: /tmp/aws/install
  args:
    creates: /usr/local/bin/aws

- name: Download kubectl binary
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"

- name: Download Helm installer script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: "0700"

- name: Install Helm binary
  ansible.builtin.command: /tmp/get_helm.sh
  args:
    creates: /usr/local/bin/helm

- name: Ensure .kube directory exists for ubuntu user on Bastion
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Copy cluster kubeconfig to Bastion
  ansible.builtin.copy:
    src: /tmp/apex-admin.conf
    dest: "{{ bastion_kubeconfig_path }}"
    owner: ubuntu
    group: ubuntu
    mode: "0600"
