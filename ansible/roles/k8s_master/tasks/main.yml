---
- name: Initialize Kubernetes control plane with kubeadm
  ansible.builtin.command: >
    kubeadm init
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
    --pod-network-cidr={{ pod_network_cidr }}
    --service-cidr={{ service_cidr }}
    --ignore-preflight-errors={{ kubeadm_ignore_preflight_errors }}
  args:
    creates: /etc/kubernetes/admin.conf

- name: Create .kube directory for ubuntu user
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Copy admin.conf to ubuntu user kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeconfig_dest }}"
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Install Flannel CNI network plugin
  become: true
  become_user: ubuntu
  ansible.builtin.command: "kubectl apply -f {{ flannel_manifest_url }}"
  register: k8s_master_flannel_apply
  changed_when: "'created' in k8s_master_flannel_apply.stdout or 'configured' in k8s_master_flannel_apply.stdout"

- name: Generate kubeadm join command for worker nodes
  ansible.builtin.command: kubeadm token create --print-join-command
  register: k8s_master_kubeadm_join_cmd
  changed_when: false

- name: Save join command as fact for worker play
  ansible.builtin.set_fact:
    k8s_master_join_command: "{{ k8s_master_kubeadm_join_cmd.stdout }}"

- name: Fetch admin.conf to local controller for Bastion distribution
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: /tmp/apex-admin.conf
    flat: true
