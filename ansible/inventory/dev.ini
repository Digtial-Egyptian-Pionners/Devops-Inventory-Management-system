[bastion]
bastion-host ansible_host=<BASTION_PUBLIC_IP>

[k8s_master]
master-1 ansible_host=<K8S_MASTER_PRIVATE_IP>

[k8s_workers]
worker-1 ansible_host=<K8S_WORKER_PRIVATE_IP>

[k8s_cluster:children]
k8s_master
k8s_workers

[k8s_cluster:vars]
ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p -q -o StrictHostKeyChecking=no -i ~/.ssh/depi-task.pem ubuntu@<BASTION_PUBLIC_IP>"'

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/depi-task.pem
ansible_python_interpreter=/usr/bin/python3
