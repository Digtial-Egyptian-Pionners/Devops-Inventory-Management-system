[bastion]
bastion-01 ansible_host=<BASTION_PUBLIC_IP>

[k8s_master]
master-01 ansible_host=<MASTER_PRIVATE_IP>

[k8s_worker]
worker-01 ansible_host=<WORKER_PRIVATE_IP>

[k8s_workers:children]
k8s_worker

[k8s_cluster:children]
k8s_master
k8s_workers

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/apex-inventory-key.pem
ansible_python_interpreter=/usr/bin/python3

[k8s_cluster:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/apex-inventory-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@<BASTION_PUBLIC_IP>"'
