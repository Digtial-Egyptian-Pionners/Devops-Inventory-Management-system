---
plugin: amazon.aws.aws_ec2
regions:
  - eu-west-3

filters:
  instance-state-name: running
  "tag:Environment": dev

keyed_groups:
  - key: tags.Role | default('untagged') | replace('-', '_')
    prefix: ""
    separator: ""

hostnames:
  - private-ip-address

compose:
  ansible_host: public_ip_address | default(private_ip_address, true)
  ansible_user: "'ubuntu'"
